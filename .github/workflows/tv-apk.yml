name: TV APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cibuild -keypass cibuild \
            -dname "CN=ci, OU=ci, O=ci, L=ci, S=ci, C=ID"
          {
            echo "storeFile=$RUNNER_TEMP/ci.jks"
            echo "storePassword=cibuild"
            echo "keyAlias=ci"
            echo "keyPassword=cibuild"
          } > local.properties
      - name: Build app-tv release
        run: |
          chmod +x gradlew
          ./gradlew :app-tv:assembleRelease --no-daemon --console=plain
      - name: Show outputs
        run: ls -lR app-tv/build/outputs/apk/
      - uses: actions/upload-artifact@v4
        with:
          name: idlix-tv-apk
          path: app-tv/build/outputs/apk/release/*.apk
          if-no-files-found: error
